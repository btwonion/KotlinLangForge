name: sync-readme

on:
  push:
    paths:
      - "README.md"
    branches:
      - master
  workflow_dispatch:

jobs:
  modrinth-description:
    runs-on: ubuntu-latest
    name: Sync Modrinth description
    steps:
      - uses: actions/checkout@v4
      - uses: btwonion/mc-readme-sync@v1
        with:
          modrinth-api-key: ${{ secrets.MODRINTH_API_KEY }}
          curseforge-api-key: ${{ secrets.CURSEFORGE_API_KEY }}
          modrinth-project-id: "1vrSzlao"
          curseforge-project-id: "1244682"
          readme-path: README.md
